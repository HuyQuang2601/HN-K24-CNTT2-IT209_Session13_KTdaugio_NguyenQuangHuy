services:
  mysql:
    image: mysql:8.0
    container_name: campus-hub-mysql
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: campus_hub
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: campus-hub-backend
    environment:
      DB_URL: jdbc:mysql://mysql:3306/campus_hub?createDatabaseIfNotExist=true
      DB_USERNAME: root
      DB_PASSWORD: 123456
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
